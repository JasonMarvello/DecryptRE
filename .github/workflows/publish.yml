# Build the package and upload it to PyPI when a version tag (v*) is pushed.
#
# This uses PyPI "Trusted Publishing": GitHub proves its identity to PyPI with a
# short-lived token, so there is no PyPI password or API key stored anywhere.
#
# Before the first run, add a "pending publisher" on PyPI with:
#   owner: JasonMarvello   repository: DecryptRE
#   workflow: publish.yml  environment: pypi

name: publish

on:
  push:
    tags: ["v*"]
  # Lets you publish an already-tagged version from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the metadata renders
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # Must match the environment name in the PyPI pending publisher.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
