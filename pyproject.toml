[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decryptre"
version = "1.0.1"
description = "Offline, open-source CLI that decrypts text with or without a passphrase and re-encrypts it with the same methods."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Marvello" }]
keywords = ["cryptography", "ciphers", "ctf", "decryption", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=41.0",
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
decryptre = "decryptre.cli:main"

[project.urls]
Homepage = "https://github.com/JasonMarvello/DecryptRE"

[tool.setuptools.packages.find]
include = ["decryptre*"]
namespaces = true

[tool.setuptools.package-data]
decryptre = [
    "wordlists/common-passwords.txt",
    "wordlists/dictionary-english.txt",
    "wordlists/dictionary-hindi.txt",
    "wordlists/dictionary-indonesian.txt",
    "wordlists/dictionary-russian.txt",
    "wordlists/dictionary-ukrainian.txt",
    "wordlists/names.txt",
    "wordlists/manifest.json",
    "wordlists/SOURCE.md",
    "data/*.txt",
    "data/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
